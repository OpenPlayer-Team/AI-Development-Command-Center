name: Create durable task

on:
  workflow_dispatch:
    inputs:
      title:
        description: Short task title
        required: true
        type: string
      description:
        description: Goal, context, acceptance criteria, and constraints
        required: true
        type: string
      priority:
        description: Task priority
        required: true
        type: choice
        options:
          - low
          - medium
          - high
        default: medium

permissions:
  contents: read
  issues: write

concurrency:
  group: task-intake-${{ github.repository }}
  cancel-in-progress: false

jobs:
  create-task:
    name: Create a durable GitHub Issue
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Validate task input
        env:
          TASK_TITLE: ${{ inputs.title }}
          TASK_DESCRIPTION: ${{ inputs.description }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${TASK_TITLE//[[:space:]]/}" ]]; then
            echo "::error::Task title must not be empty."
            exit 1
          fi
          if [[ ${#TASK_TITLE} -gt 200 ]]; then
            echo "::error::Task title must be 200 characters or fewer."
            exit 1
          fi
          if [[ -z "${TASK_DESCRIPTION//[[:space:]]/}" ]]; then
            echo "::error::Task description must not be empty."
            exit 1
          fi
          if [[ ${#TASK_DESCRIPTION} -gt 12000 ]]; then
            echo "::error::Task description must be 12000 characters or fewer."
            exit 1
          fi

      - name: Ensure task labels exist
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/labels" -f name=agent-task -f color=6f42c1 -f description="Durable task submitted to the command center" >/dev/null 2>&1 || true
          gh api --method POST "repos/${GITHUB_REPOSITORY}/labels" -f name="priority:low" -f color=cfd3d7 >/dev/null 2>&1 || true
          gh api --method POST "repos/${GITHUB_REPOSITORY}/labels" -f name="priority:medium" -f color=fbca04 >/dev/null 2>&1 || true
          gh api --method POST "repos/${GITHUB_REPOSITORY}/labels" -f name="priority:high" -f color=d93f0b >/dev/null 2>&1 || true

      - name: Create task issue
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
          TASK_TITLE: ${{ inputs.title }}
          TASK_DESCRIPTION: ${{ inputs.description }}
          TASK_PRIORITY: ${{ inputs.priority }}
          TASK_ACTOR: ${{ github.actor }}
          TASK_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          body_file="$(mktemp)"
          trap 'rm -f "$body_file"' EXIT
          {
            printf '%s\n\n' "$TASK_DESCRIPTION"
            printf '%s\n' '---'
            printf 'Priority: **%s**\n' "$TASK_PRIORITY"
            printf 'Submitted by: @%s\n' "$TASK_ACTOR"
            printf 'Source commit: %s\n\n' "$TASK_SHA"
            printf '%s\n' '> This issue is a durable task record. It does not automatically execute code or authorize merging.'
          } > "$body_file"
          issue_url="$(gh issue create --repo "$GITHUB_REPOSITORY" --title "$TASK_TITLE" --body-file "$body_file" --label agent-task --label "priority:$TASK_PRIORITY")"
          echo "issue_url=$issue_url" >> "$GITHUB_OUTPUT"
          echo "Created durable task: $issue_url"

      - name: Publish task link
        env:
          ISSUE_URL: ${{ steps.create.outputs.issue_url }}
        run: |
          {
            echo "## Task created"
            echo
            echo "A durable GitHub Issue was created:"
            echo
            echo "$ISSUE_URL"
            echo
            echo "No agent execution or merge was triggered."
          } >> "$GITHUB_STEP_SUMMARY"
