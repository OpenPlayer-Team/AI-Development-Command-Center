name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit dependencies (fail on high/critical)
        shell: bash
        env:
          AUDIT_REPORT: ${{ runner.temp }}/npm-audit-report.json
        run: |
          set +e
          npm audit --audit-level=high --json > "$AUDIT_REPORT"
          audit_exit=$?
          set -e
          node scripts/check-npm-audit.mjs "$AUDIT_REPORT" "$audit_exit"
      - name: Lint GitHub Actions workflow files
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Test AI patch publisher policy
        run: bash scripts/test-validate-agent-patch.sh
      - name: Test npm audit gate policy
        run: node scripts/test-check-npm-audit.mjs
      - name: Test local agent-context secret redaction
        run: node scripts/test-redact-agent-context.mjs
      - name: Run tests
        run: npm test
      - name: Build production bundle
        run: npm run build
