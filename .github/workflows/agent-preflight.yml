name: Agent runner preflight

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Existing agent-task GitHub Issue number
        required: true
        type: number

permissions:
  contents: read
  issues: read

concurrency:
  group: agent-preflight-${{ github.repository }}-${{ inputs.issue_number }}
  cancel-in-progress: false

jobs:
  validate-task:
    name: Validate task before any execution
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Validate issue record
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$ISSUE_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Issue number must be a positive integer."
            exit 1
          fi

          issue_file="$RUNNER_TEMP/agent-preflight-issue.json"
          trap 'rm -f "$issue_file"' EXIT
          gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --json number,title,body,state,labels,url > "$issue_file"
          node <<'NODE'
          const fs = require('node:fs');
          const issue = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/agent-preflight-issue.json', 'utf8'));
          const labels = (issue.labels ?? []).map(label => label.name);
          const title = (issue.title ?? '').trim();
          const body = (issue.body ?? '').trim();
          const problems = [];
          if (issue.state !== 'OPEN') problems.push('Issue must be open.');
          if (!labels.includes('agent-task')) problems.push('Issue must have the agent-task label.');
          if (!title) problems.push('Issue title is empty.');
          if (title.length > 200) problems.push('Issue title exceeds 200 characters.');
          if (!body) problems.push('Issue body is empty.');
          if (body.length > 12000) problems.push('Issue body exceeds 12000 characters.');
          if (Number(issue.number) !== Number(process.env.ISSUE_NUMBER)) problems.push('Returned issue number does not match the requested issue.');
          if (problems.length) {
            for (const problem of problems) console.error('::error::' + problem);
            process.exit(1);
          }
          let supplied;
          try { supplied = new URL(issue.url); } catch { throw new Error('Issue URL is invalid.'); }
          const expected = new URL('https://github.com/' + process.env.GITHUB_REPOSITORY + '/issues/' + issue.number);
          if (supplied.origin !== expected.origin || supplied.pathname !== expected.pathname) {
            throw new Error('Issue URL does not match this repository and issue number.');
          }
          console.log('Validated issue #' + issue.number + ': ' + title);
          console.log('Task text is untrusted data and will not be executed as shell commands.');
          NODE

      - name: Publish safe preflight result
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        shell: bash
        run: |
          {
            echo "## Agent preflight completed"
            echo
            echo "- **Task:** Issue #$ISSUE_NUMBER"
            echo "- **Issue:** $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER"
            echo "- **Validation:** passed"
            echo "- **Execution:** not started"
            echo
            echo "This repository has no configured AI provider or isolated code-execution runner yet. No source code was checked out or executed, no secrets were accessed, and no pull request was created."
            echo
            echo "Next gate: configure and threat-model a bounded runner before enabling code changes."
          } >> "$GITHUB_STEP_SUMMARY"
