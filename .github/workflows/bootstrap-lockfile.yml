name: Bootstrap package lockfile artifact

on:
  push:
    branches:
      - "feat/**"
    paths:
      - ".github/workflows/bootstrap-lockfile.yml"

permissions:
  contents: write

jobs:
  generate:
    name: Generate reproducible npm lock metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Generate lockfile without running lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Record generator versions
        run: |
          {
            echo "## Lockfile generator"
            echo
            echo "- Node: $(node --version)"
            echo "- npm: $(npm --version)"
            echo "- Package manifest SHA-256: $(sha256sum package.json | cut -d ' ' -f 1)"
            echo "- Package lock generated with lifecycle scripts disabled."
          } >> "$GITHUB_STEP_SUMMARY"


      - name: Commit generated lockfile to the feature branch
        shell: bash
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "${GITHUB_REPOSITORY}" == "OpenPlayer-Team/AI-Development-Command-Center" ]] || {
            echo "::error::Unexpected repository; refusing to push."
            exit 1
          }
          [[ "${BRANCH_NAME}" =~ ^feat/[A-Za-z0-9._/-]+$ ]] || {
            echo "::error::Lockfile bootstrap only permits the dedicated feat/* branch."
            exit 1
          }
          git add -- package-lock.json
          if git diff --cached --quiet; then
            echo "Package lockfile is unchanged; no commit needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: commit reproducible npm lockfile"
          git push origin "HEAD:${BRANCH_NAME}"

      - name: Upload lockfile for review and commit
        uses: actions/upload-artifact@v7
        with:
          name: generated-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
